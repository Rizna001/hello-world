<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duas Collection - Authentic Islamic Supplications</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* 内联样式确保主题色立即生效，避免闪烁 */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.light,
      html.light body {
        background-color: #f3f7f3 !important;
        color: #00160d;
      }
      html.theme-sepia,
      html.theme-sepia body {
        background-color: #f1e7cf !important;
        color: #433422;
      }
      html.dark,
      html.dark body {
        background-color: #00160d !important;
        color: #e3ece5;
      }
    </style>
    <script>
      // 在 React 加载前立即设置主题，避免闪烁
      (function () {
        const isInIframe = window.self !== window.top;

        function applyThemeToDOM(theme) {
          document.documentElement.classList.remove("light", "dark", "theme-sepia");
          document.documentElement.classList.add(theme === "sepia" ? "theme-sepia" : theme);
          document.documentElement.setAttribute("data-theme", theme);
        }

        if (isInIframe) {
          // 监听父窗口主动推送的主题消息
          window.addEventListener("message", function (event) {
            if (event.data && typeof event.data.theme === "string") {
              const theme = event.data.theme;
              if (theme === "light" || theme === "dark") {
                applyThemeToDOM(theme);
              }
            }
          });
        } else {
          // Apply the saved theme and font size before React loads (avoids a flash)
          var savedTheme = null, savedScale = null;
          try {
            savedTheme = localStorage.getItem("theme");
            savedScale = Number(localStorage.getItem("fontScale"));
          } catch (e) {}
          applyThemeToDOM(
            savedTheme === "dark" || savedTheme === "sepia" ? savedTheme : "light"
          );
          if (savedScale >= 80 && savedScale <= 150) {
            document.documentElement.style.fontSize = savedScale + "%";
          }
        }
      })();
    </script>
      <script>
      (function () {
        if (window.self === window.top) return;
        var reported = {};
        window.addEventListener("error", function (event) {
          // 资源加载失败的 error 事件没有 message，此处仅上报 JS 运行时错误
          if (!event || !event.message) return;
          var key =
            event.message + "|" + (event.filename || "") + "|" + (event.lineno || 0);
          if (reported[key]) return; // 相同错误只上报一次，避免渲染循环刷屏
          reported[key] = true;
          try {
            window.parent.postMessage(
              {
                type: "sandbox-runtime-error",
                payload: {
                  message: String(event.message).slice(0, 500),
                  filename: event.filename || "",
                  lineno: event.lineno || 0,
                  colno: event.colno || 0,
                  stack:
                    event.error && event.error.stack
                      ? String(event.error.stack).slice(0, 2000)
                      : ""
                }
              },
              "*"
            );
          } catch (e) {
            /* 上报失败不影响页面运行 */
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
